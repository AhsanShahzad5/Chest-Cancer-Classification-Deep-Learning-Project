# Checks that run automatically on every `git commit`.
# One-time setup per clone:  uv run pre-commit install
# Run on every file by hand: uv run pre-commit run --all-files

# files these hooks must never rewrite: notebooks, lock files, and DVC's metrics file
# (its hash is recorded in dvc.lock, so changing even its whitespace breaks `dvc status`)
exclude: ^(research/|uv\.lock$|dvc\.lock$|scores\.json$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: check-added-large-files # stops a model or dataset being committed by accident
        args: ["--maxkb=5000"]

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint and auto-fix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
