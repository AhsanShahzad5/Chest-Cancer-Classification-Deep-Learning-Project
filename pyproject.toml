[project]
name = "chest-cancer-classification-end-to-end-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.1",
    "ensure>=1.0.4",
    "fastapi>=0.141.1",
    "gdown>=6.2.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mflow>=1.3.1",
    "mlflow>=3.16.1",
    "notebook>=7.6.2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "python-box>=7.4.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "slowapi>=0.1.10",
    "tensorflow>=2.21.0",
    "tqdm>=4.70.1",
    "types-pyyaml>=6.0.12.20260906",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cnnClassifier"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
# notebooks and the one-time scaffold script are not production code
extend-exclude = ["research", "template.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TRY", "N", "C4"]
ignore = [
    "E501",    # long lines
    "N999",    # package is named cnnClassifier (renaming would touch every import)
    "N815",    # source_URL field name is used across config files
    "TRY003",  # long messages inside exceptions are fine here
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests import app.py from the project root
