stages:
  data_ingestion:
    cmd: python src/cnnClassifier/pipeline/stage_01_data_ingestion.py
    deps:
      - src/cnnClassifier/pipeline/stage_01_data_ingestion.py
      - src/cnnClassifier/components/data_ingestion.py
      - src/cnnClassifier/config/configuration.py
      - src/cnnClassifier/entity/config_entity.py
      - src/cnnClassifier/utils/common.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion

  prepare_base_model:
    cmd: python src/cnnClassifier/pipeline/stage_02_prepare_base_model.py
    deps:
      - src/cnnClassifier/pipeline/stage_02_prepare_base_model.py
      - src/cnnClassifier/components/prepare_base_model.py
      - src/cnnClassifier/config/configuration.py
      - src/cnnClassifier/entity/config_entity.py
      - src/cnnClassifier/utils/common.py
      - config/config.yaml
    params:
      - IMAGE_SIZE
      - INCLUDE_TOP
      - CLASSES
      - WEIGHTS
      - LEARNING_RATE
    outs:
      - artifacts/prepare_base_model

  training:
    cmd: python src/cnnClassifier/pipeline/stage_03_model_trainer.py
    deps:
      - src/cnnClassifier/pipeline/stage_03_model_trainer.py
      - src/cnnClassifier/components/model_trainer.py
      - src/cnnClassifier/config/configuration.py
      - src/cnnClassifier/entity/config_entity.py
      - src/cnnClassifier/utils/common.py
      - config/config.yaml
      - artifacts/data_ingestion/CT Scan Dataset for Project/train
      - artifacts/prepare_base_model/base_model_updated.h5
    params:
      - IMAGE_SIZE
      - EPOCHS
      - BATCH_SIZE
      - AUGMENTATION
      - LEARNING_RATE
    outs:
      - artifacts/training/model.h5

  evaluation:
    cmd: python src/cnnClassifier/pipeline/stage_04_model_evaluation.py
    deps:
      - src/cnnClassifier/pipeline/stage_04_model_evaluation.py
      - src/cnnClassifier/components/model_evaluation_mlflow.py
      - src/cnnClassifier/config/configuration.py
      - src/cnnClassifier/entity/config_entity.py
      - src/cnnClassifier/utils/common.py
      - config/config.yaml
      - artifacts/data_ingestion/CT Scan Dataset for Project/test
      - artifacts/training/model.h5
    params:
      - IMAGE_SIZE
      - BATCH_SIZE
    metrics:
      - scores.json:
          cache: false
